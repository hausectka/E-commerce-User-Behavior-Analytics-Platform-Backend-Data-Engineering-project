version: 2

models:

  - name: product_funnel
    description: >
      Product-level funnel summary derived from clickstream events.
      This model aggregates product interactions across the funnel stages
      — product_view, add_to_cart, and purchase — and calculates conversion
      rates between each stage.  
      
      The purpose of this model is to help understand:
      - Which products attract the most engagement  
      - Where customers are dropping off in the funnel  
      - Which products convert best from view → cart → purchase  
      - Product-level performance for marketing, merchandising, and UX optimization  

    columns:

      - name: product_id
        description: "Unique identifier of the product."

      - name: product_views
        description: "Total number of product_view events for the product."

      - name: cart_adds
        description: "Total number of add_to_cart events for the product."

      - name: purchases
        description: "Total number of purchase events for the product."

      - name: view_to_cart_rate
        description: >
          Conversion rate from product view to cart add.  
          Calculated as: cart_adds / product_views.

      - name: cart_to_purchase_rate
        description: >
          Conversion rate from cart add to purchase.  
          Calculated as: purchases / cart_adds.

      - name: view_to_purchase_rate
        description: >
          End-to-end conversion rate from product view directly to purchase.  
          Calculated as: purchases / product_views.